apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - mytodo-be-namespace.yaml
  - alb-ingress.yaml
  - grafana-ingress.yaml
  - argocd-ingress.yaml


patches:
  - path: patch-configmap.yaml
  - path: patch-deployment.yaml
  - patch: |
      - op: replace
        path: /metadata/namespace
        value: argocd
    target:
      kind: Ingress
      name: dev-argocd-ingress
  - patch: |
      - op: replace
        path: /metadata/namespace
        value: monitoring
    target:
      kind: Ingress
      name: dev-grafana-ingress

# components:
#   - ./ingress-component

namePrefix: dev-
namespace: dev-mytodo

labels:
- pairs:
    environment: dev
  includeSelectors: true
  includeTemplates: true
