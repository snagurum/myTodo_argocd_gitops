deploymentMode: SingleBinary

loki:
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  useTestSchema: true
  auth_enabled: false
  commonConfig:
    replication_factor: 1

singleBinary:
  replicas: 1

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false